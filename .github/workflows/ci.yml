name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 同一リポジトリからのPRは、整形漏れをfailさせずCI側で自動修正してpushする (#232)。
  # 修正コミットはPATでpushされるため新しいCI runがトリガーされ、必須チェックも新SHAで再評価される。
  # 差分ゼロなら何もしない（＝自動修正コミットのrunで再修正は起きず、ループしない）。
  autofix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.AUTOFIX_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.9"

      - name: Auto-fix lint & format
        run: |
          ruff check --fix core/ cli/ server/ || true
          ruff format core/ cli/ server/

      - name: Push fixes if needed
        run: |
          if git diff --quiet; then
            echo "No fixes needed."
            exit 0
          fi
          git config user.name "animaworks-dev-team"
          git config user.email "animaworks-dev-team@users.noreply.github.com"
          git commit -am "style: ruff auto-fix by CI"
          git push

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,all-tools]"

      - name: Check for merge-conflict markers
        run: python scripts/check_conflict_markers.py

      - name: Lint
        run: |
          ruff check core/ cli/ server/
          ruff format --check core/ cli/ server/

      - name: Check generated reference docs are fresh
        run: python scripts/gen_reference.py all --check

      - name: Run unit tests
        run: |
          pytest tests/unit/ -q -rfE --timeout=30 -m "not live and not azure and not ollama" --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=70

  i18n-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Advisory until the pipeline handles HTML comments, sentinel drops and
    # zh output; some sections keep their previous hand-made translation.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install translation-check dependency
        run: pip install pyyaml

      - name: Check translation freshness
        run: python scripts/translate.py all --check

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,all-tools]"

      - name: Run e2e tests
        run: |
          pytest tests/e2e/ -q -rfE --timeout=60 -m "not live and not azure and not ollama"

